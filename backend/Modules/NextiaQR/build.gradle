plugins {
    id 'java'
}

group = 'edu.upc.essi.dtim'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':Modules:NextiaCore')
    implementation project(':Modules:NextiaDataLayer')

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Apache Jena for RDF/SPARQL processing (same as NextiaCore)
    implementation group: 'org.apache.jena', name: 'apache-jena-libs', version: '4.1.0', ext: 'pom'
    implementation group: 'org.apache.jena', name: 'jena-querybuilder', version: '4.1.0'

    implementation group: 'commons-codec', name: 'commons-codec', version: '1.16.0'
    implementation group: 'org.json', name: 'json', version: '20231013'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.11.0'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation group: 'org.jpmml', name: 'pmml-evaluator', version: '1.6.4'
    implementation group: 'commons-io', name: 'commons-io', version: '2.15.0'
    
    // JGraphT for graph operations
    implementation group: 'org.jgrapht', name: 'jgrapht-core', version: '1.5.1'
    
    // Google Guava for collections and utilities
    implementation group: 'com.google.guava', name: 'guava', version: '31.1-jre'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
}

test {
    useJUnitPlatform()
}